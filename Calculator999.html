<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --ink:#2b2420; --paper:#faf6ef; --accent:#b5652f; --accent2:#7c8a6f;
      --line:#e3dccc; --muted:#8a7f6f;
    }
    *{box-sizing:border-box;}
    body{
      font-family:'Helvetica Neue',Arial,sans-serif; background:var(--paper); color:var(--ink);
      margin:0; padding:24px 16px 60px; max-width:560px; margin-inline:auto;
    }
    h1{font-size:20px; letter-spacing:.02em; margin:0 0 4px;}
    .sub{color:var(--muted); font-size:13px; margin-bottom:24px;}
    .sub .th{display:block; font-size:11px; margin-top:2px;}
    .card{
      background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px;
      margin-bottom:16px; box-shadow:0 2px 10px rgba(60,45,20,.04); position:relative;
    }
    .card-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
      color:var(--muted); margin-bottom:12px;}
    label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px;}
    label:first-child{margin-top:0;}
    label .th{display:block; font-size:11px; font-weight:400; color:var(--muted); margin-top:2px;}
    /* font-size 16px ขึ้นไป กัน iOS Safari ซูมเข้าอัตโนมัติตอนแตะช่องกรอกข้อมูล */
    select,input[type=number],input[type=text],textarea{
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
      font-size:16px; background:#fffdf9; color:var(--ink); font-family:inherit;
    }
    textarea{resize:vertical; min-height:70px;}
    .row{display:flex; gap:12px;}
    .row > div{flex:1;}
    .chk{display:flex; align-items:center; gap:8px; margin:14px 0;}
    .chk input{width:18px; height:18px; flex-shrink:0;}
    .chk .lbl{font-weight:500; font-size:14px;}
    .chk .th{display:block; font-size:11px; font-weight:400; color:var(--muted); margin-top:1px;}
    .radio-group{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
    .radio-group label{display:flex; align-items:center; gap:8px; font-weight:500; margin:0; font-size:14px;}
    .radio-group .th{display:block; font-size:11px; font-weight:400; color:var(--muted); margin-top:1px;}
    button{
      width:100%; padding:14px; background:var(--accent); color:#fff; border:none;
      border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;
      font-family:inherit;
    }
    button:hover{opacity:.92;}
    button .th{display:block; font-size:11px; font-weight:400; opacity:.85; margin-top:2px;}
    button.secondary{background:#fff; color:var(--accent); border:2px dashed var(--accent);}
    button.ghost{background:#fff; color:var(--ink); border:1px solid var(--line);}
    button.remove{
      width:auto; padding:6px 12px; background:transparent; color:#b23; border:1px solid #e3c9c9;
      font-size:12px; font-weight:600; margin:0; position:absolute; top:16px; right:16px;
    }
    /* ตารางสรุปค่าใช้จ่าย - ตัวเล็กลงตามที่ขอ */
    .breakdown{margin-top:16px; border-top:1px solid var(--line); padding-top:12px;}
    .line{display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:11.5px;
      color:var(--muted); border-bottom:1px dashed var(--line); line-height:1.35;}
    .line > span:last-child{color:var(--ink); white-space:nowrap;}
    .line.total{border-top:2px solid var(--ink); border-bottom:none; font-weight:700; font-size:14px;
      margin-top:6px; padding-top:10px; color:var(--accent);}
    .line.total > span:last-child{color:var(--accent); font-size:15px;}
    .line .th{display:block; font-size:10px; font-weight:400; color:var(--muted); margin-top:1px;}
    #itemsContainer .th[id^="thresholdNote-"]{font-size:15px; line-height:1.45; margin:14px 0 6px;}
    .line.total .th{font-size:10.5px;}
    .line.discount > span:last-child{color:var(--accent2);}
    .line.grand{border-top:2px solid var(--ink); border-bottom:none; font-weight:700; font-size:20px;
      margin-top:6px; padding-top:14px; color:var(--accent);}
    .line.grand > span:last-child{color:var(--accent); font-size:20px;}
    .err{color:#b23; font-size:13px; margin-top:10px; display:none;}
    .item-num{font-size:13px; font-weight:700; color:var(--accent); margin-bottom:8px;}
    /* แนบรูปอ้างอิง */
    .photo{margin-top:6px; display:flex; align-items:center; gap:12px;}
    .photo-thumb{width:56px; height:56px; border-radius:8px; object-fit:cover;
      border:1px solid var(--line); display:none;}
    .photo label.file{
      flex:1; margin:0; display:flex; align-items:center; justify-content:center; padding:11px;
      background:#fffdf9; color:var(--accent); border:1px dashed var(--accent); border-radius:8px;
      font-size:13px; font-weight:600; cursor:pointer;}
    .photo input[type=file]{display:none;}
    .photo-status{font-size:11px; color:var(--muted); margin-top:6px;}
    /* ด่านเข้าใช้งาน (รหัสผ่าน + Google sign-in) */
    #gate{position:fixed; inset:0; background:var(--paper); z-index:100;
      display:flex; align-items:center; justify-content:center; padding:24px;}
    #gate .gate-card{background:#fff; border-radius:16px; padding:36px 32px; max-width:340px;
      width:100%; text-align:center; box-shadow:0 10px 30px rgba(60,45,20,.1);}
    #gate .brand{font-size:19px; font-weight:700; color:var(--ink); margin:0 0 2px;}
    #gate .app-name{font-size:15px; font-weight:700; color:var(--ink); margin:0 0 18px;}
    #gate .gate-hint{font-size:13px; color:var(--muted); margin-bottom:16px;}
    #gate input[type=password]{
      /* font-size 16px ขึ้นไป กัน iOS Safari ซูมเข้าอัตโนมัติตอนแตะช่องกรอกรหัสผ่าน */
      width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
      font-size:16px; text-align:center; margin-bottom:14px; background:#fffdf9;}
    #gate button{width:100%; padding:12px; background:#171a2b; color:#fff; border:none;
      border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;}
    #gate button:hover{opacity:.92;}
    #gate #gsiButton{display:flex; justify-content:center; margin:6px 0 4px;}
    #gate .gate-error{font-size:12px; color:#b23; min-height:16px; margin-top:8px;}
    /* พรีวิวใบเสนอราคา */
    #previewOverlay{position:fixed; inset:0; background:rgba(43,36,32,.45); z-index:50;
      display:none; overflow:auto; padding:20px 12px 40px;}
    #previewOverlay.on{display:block;}
    .quote{background:#fff; border:1px solid var(--line); border-radius:14px; max-width:560px;
      margin:0 auto; padding:24px 20px; box-shadow:0 10px 30px rgba(60,45,20,.2);}
    .quote h2{font-size:18px; margin:0 0 2px; letter-spacing:.02em;}
    .quote .meta{font-size:12px; color:var(--muted); margin-bottom:16px;}
    .qitem{border-top:1px dashed var(--line); padding:10px 0; display:flex; gap:10px; align-items:flex-start;}
    .qcol{flex:1; min-width:0;}
    .qthumb{width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--line);
      flex-shrink:0;}
    .qitem-head{display:flex; justify-content:space-between; gap:12px; font-weight:700; font-size:13px;}
    .qitem-head span:last-child{white-space:nowrap;}
    .qitem-spec{font-size:11.5px; color:var(--muted); margin-top:3px;}
    .qbreak{margin-top:6px;}
    .qbreak div{display:flex; justify-content:space-between; gap:12px; font-size:11.5px;
      color:var(--muted); padding:1.5px 0;}
    .qbreak div span:last-child{white-space:nowrap; font-variant-numeric:tabular-nums;}
    .qbreak div.sum{color:var(--ink); font-weight:600; border-top:1px dotted var(--line); margin-top:3px; padding-top:4px;}
    .qtotal{display:flex; justify-content:space-between; border-top:2px solid var(--ink);
      margin-top:8px; padding-top:12px; font-weight:700; font-size:17px; color:var(--accent);}
    .quote-actions{display:flex; gap:10px; max-width:560px; margin:14px auto 0;}
    .quote-actions button{margin:0;}
    @media print{
      body > *:not(#previewOverlay){display:none !important;}
      #previewOverlay{position:static; background:#fff; padding:0; display:block;}
      .quote{box-shadow:none; border:none; border-radius:0; max-width:none; padding:0;}
      .quote-actions{display:none;}
    }
  </style>
</head>
<body>
<!-- ===== Mergee Auth Gate (Google Sign-In) — เพิ่มโดย Claude ===== -->
<!-- ชั้นนี้แยกต่างหากจากด่านรหัสผ่านด้านล่าง (#gate) — z-index สูงกว่ามาก จึงบังทุกอย่างรวม
     ทั้งด่านรหัสผ่านไว้จนกว่าจะล็อกอิน Google ผ่านก่อน แล้วค่อยเจอด่านรหัสผ่านตามปกติ ซึ่งไม่จำ
     การปลดล็อกอีกต่อไป ต้องใส่รหัสผ่านใหม่ทุกครั้ง แม้จะเพิ่งผ่าน Google Sign-In มาก็ตาม — การจำ 8 ชม.
     มีผลกับ Google Sign-In เท่านั้น สองด่านนี้เป็นอิสระต่อกัน -->
<div id="mergee-auth-gate" style="position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:999999;padding:20px;font-family:'Sarabun',sans-serif">
  <div style="background:#fff;border-radius:16px;padding:32px 28px;max-width:340px;width:100%;text-align:center">
    <div style="font-size:22px;font-weight:600;color:#1a1a2e;margin-bottom:6px">Mergee</div>
    <div style="font-size:13px;color:#888;margin-bottom:22px">สำหรับพนักงานที่ได้รับอนุญาตเท่านั้น</div>
    <div id="mergee-g-signin" style="display:flex;justify-content:center"></div>
    <div id="mergee-auth-loading" style="display:none;color:#888;font-size:13px;margin-top:14px">กำลังตรวจสอบสิทธิ์...</div>
    <div id="mergee-auth-error" style="display:none;color:#c62828;font-size:13px;margin-top:14px">อีเมลนี้ไม่มีสิทธิ์เข้าถึงหน้านี้</div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwzXSMXQD1AFjCDTTFm0iZ4eV4Bhi8qzkZI5Te3v4TFz01TxTu7xVET_OaKGv22R2k/exec';
  var CLIENT_ID = '541429667442-6im11d4rrg09m95suab32vcj7kf3lpf1.apps.googleusercontent.com';
  var SESSION_KEY = 'mergee_auth_expiry';
  var SESSION_DURATION_MS = 8 * 60 * 60 * 1000; // จำการล็อกอินไว้ 8 ชั่วโมง ใช้ร่วมกันทุกไฟล์ในโดเมนนี้

  function isSessionValid(){
    var exp = parseInt(localStorage.getItem(SESSION_KEY) || '0', 10);
    return exp > Date.now();
  }

  function markSessionAuthorized(){
    localStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_DURATION_MS));
  }

  // เคยล็อกอินผ่านมาแล้วในเบราว์เซอร์นี้ และยังไม่หมดอายุ ข้ามเกตไปเลย
  if (isSessionValid()) {
    var existingGate = document.getElementById('mergee-auth-gate');
    if (existingGate) existingGate.style.display = 'none';
    return;
  }

  function showError(){
    document.getElementById('mergee-auth-loading').style.display = 'none';
    document.getElementById('mergee-auth-error').style.display = 'block';
    document.getElementById('mergee-g-signin').style.display = 'flex';
  }

  function handleCredentialResponse(response){
    document.getElementById('mergee-auth-error').style.display = 'none';
    document.getElementById('mergee-g-signin').style.display = 'none';
    document.getElementById('mergee-auth-loading').style.display = 'block';
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ token: response.credential })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      document.getElementById('mergee-auth-loading').style.display = 'none';
      if (data && data.authorized) {
        markSessionAuthorized();
        var gate = document.getElementById('mergee-auth-gate');
        if (gate) gate.style.display = 'none';
      } else {
        showError();
      }
    })
    .catch(function(){ showError(); });
  }

  function initGate(){
    // สคริปต์ของ Google โหลดแบบ async/defer เวลาไม่แน่นอน — ต้องรอจนกว่า
    // window.google.accounts.id จะพร้อมจริงๆ ไม่งั้นปุ่มจะไม่ขึ้นแบบเงียบๆ
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('mergee-g-signin'),
        { theme: 'outline', size: 'large', text: 'signin_with' }
      );
    } else {
      setTimeout(initGate, 150);
    }
  }

  initGate();
})();
</script>
<!-- ===== จบ Mergee Auth Gate ===== -->

  <div id="gate">
    <div class="gate-card">
      <div id="pwStep">
        <div class="brand">Mergee</div>
        <div class="app-name">Painting Pricing Calculator</div>

      </div>

  <div id="appRoot" style="display:none;">
  <h1>Painting Pricing Calculator</h1>
  <div class="sub">Estimate price based on the latest rates<span class="th">(คำนวณราคาประเมินจากอัตราล่าสุด)</span></div>

  <div class="card">

    <input type="text" id="quotationNo">

    <label>Commission ID / Project ID<span class="th">(รหัสงาน/โปรเจกต์)</span></label>
    <input type="text" id="commissionId">
  </div>

  <div id="itemsContainer"></div>

  <button type="button" class="secondary" onclick="addItem()">+ Add Item<span class="th">(เพิ่มรายการ)</span></button>

  <div class="card">
    <div class="line grand"><span>Grand Total<span class="th" style="display:inline; font-size:12px; margin-left:4px;">(ยอดรวมทั้งหมด)</span></span><span id="grand-total">THB 0.00</span></div>
  </div>

  <div class="card">
    <label>Internal Notes<span class="th">(บันทึกภายใน)</span></label>

    <label>Assessed by<span class="th">(ประเมินโดย)</span></label>

  </div>

  <div id="previewOverlay">
    <div class="quote" id="quoteBody"></div>
    <div class="quote-actions">
      <button type="button" id="printBtn" onclick="createAndSavePdf()">Print PDF<span class="th">(สั่งพิมพ์)</span></button>
      <button type="button" class="ghost" onclick="closePreview()">Close<span class="th">(ปิด)</span></button>
    </div>
    <div class="quote-actions"><div id="pdfMsg" style="font-size:12px; color:#fff; padding:2px 4px;"></div></div>
  </div>

  <script>
    // ===== ตั้งค่าการเชื่อมต่อ Apps Script backend =====
    const API_URL = 'https://script.google.com/macros/s/AKfycbxKb0Gvil8mTxiGY6pI3WJoQilnVSIrjgY_fHk6yN5vbqsT0Oo6gATFQHHydveVoW2r/exec';
    const API_KEY = 'PAINTINGASSESSMENTCALCULATOR01';

    // แปลง response เป็น JSON พร้อมบอกสาเหตุจริงเมื่อไม่ใช่ JSON (Apps Script ส่งหน้า HTML
    // เวลา: ยังไม่ได้อนุญาตสิทธิ์ / deployment เก่า / ตั้ง Who has access ไม่เป็น Anyone)
    function parseApiResponse(r){
      return r.text().then(function(text){
        try { return JSON.parse(text); }
        catch (err) {
          const detail = '<details style="margin-top:8px;"><summary style="cursor:pointer;">ดูรายละเอียดที่เซิร์ฟเวอร์ตอบกลับ</summary>' +
            '<div style="font-size:11px;word-break:break-all;margin-top:6px;">HTTP ' + r.status + ' · redirected: ' + r.redirected +
            '<br>final URL: ' + r.url + '<br><br>' + String(text).replace(/</g,'&lt;').slice(0, 500) + '</div></details>';
          if (/accounts\.google\.com|ต้องการสิทธิ์|Authorization|Sign in/i.test(text))
            throw new Error('เซิร์ฟเวอร์ขอให้ล็อกอิน/อนุญาตสิทธิ์ — กด Authorize แล้วตั้ง Deploy > Who has access = Anyone' + detail);
          if (r.status === 404)
            throw new Error('ไม่พบ deployment นี้ (HTTP 404)' + detail);
          if (/<html/i.test(text))
            throw new Error('เซิร์ฟเวอร์ตอบกลับเป็นหน้า HTML ไม่ใช่ JSON (HTTP ' + r.status + ')' + detail);
          throw new Error('อ่านคำตอบจากเซิร์ฟเวอร์ไม่ได้' + detail);
        }
      });
    }

    function callApi(action, payload){
      // action อ่านอย่างเดียว ใช้ GET เพื่อเลี่ยง CORS preflight
      const p = (action === 'getFormOptions' || action === 'calculatePrice')
        ? fetch(API_URL + '?' + new URLSearchParams({ action, key: API_KEY, payload: JSON.stringify(payload || {}) }).toString())
        // action เขียนข้อมูล ใช้ POST + text/plain เพื่อเลี่ยง CORS preflight (Apps Script ไม่รองรับ doOptions)
        : fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, key: API_KEY, payload: payload || {} })
          });
      return p.then(parseApiResponse, function(netErr){
        throw new Error('ติดต่อเซิร์ฟเวอร์ไม่ได้ (' + netErr.message + ') — URL ผิด, deployment ถูกลบ, หรือ Who has access ไม่ได้ตั้งเป็น Anyone');
      });
    }

    // ===== คำนวณราคาฝั่ง client (ไม่ยิงไป Apps Script ทุกครั้งที่พิมพ์) =====
    // ใช้ข้อมูล tier/rate ที่ดึงมาจาก getFormOptions() ครั้งเดียวตอนเปิดหน้า (เก็บใน FORM_DATA)
    // สูตรคำนวณตรงนี้ต้อง sync กับ calculatePrice() ฝั่ง Code.gs เสมอ — ฝั่ง server ยังเป็นตัวคำนวณจริง
    // ตอนกด Preview/Print PDF (createQuotationPdf เรียก calculatePrice ฝั่ง server อีกที ไม่เชื่อเลขจาก client)
    function round2(n){ return Math.round((Number(n) || 0) * 100) / 100; }

    function lookupTier(tiers, key){
      for (let i = 0; i < tiers.length; i++){
        const t = tiers[i];
        if (key >= t.min && key <= t.max) return t.value;
      }
      return tiers.length ? tiers[tiers.length - 1].value : 0;
    }

    function calculatePriceLocal(input){
      const p = FORM_DATA[input.product];
      if (!p) throw new Error('ไม่รู้จักประเภทงานนี้');

      const width = Number(input.width) || 0;
      const height = Number(input.height) || 0;
      const size = round2(width * height);

      const pricePerCm2 = lookupTier(p.sizeTiers || [], size);
      const genericPrice = round2(size * pricePerCm2);

      const materialRate = (p.material && p.material[input.material]) || 0;
      const difficultyRate = (p.difficulty && p.difficulty[input.difficulty]) || 0;
      const materialCost = round2(genericPrice * materialRate);
      const difficultyCost = round2(genericPrice * difficultyRate);

      const tierKeyForAddon = p.addonTierBy === 'genericPrice' ? genericPrice : size;

      let fastTrackCost = 0;
      if (input.fastTrack) {
        const v = lookupTier(p.fastTrackTiers || [], tierKeyForAddon);
        fastTrackCost = v < 1 ? round2(genericPrice * v) : round2(v);
      }
      let frameCost = 0;
      if (input.frame) {
        const v = lookupTier(p.frameTiers || [], tierKeyForAddon);
        frameCost = v < 1 ? round2(genericPrice * v) : round2(v);
      }

      const subtotalBeforeMembership = round2(
        genericPrice + materialCost + difficultyCost + fastTrackCost + frameCost
      );

      const m = (p.membership && p.membership[input.membership]) || { percent: 0, fee: 0, minSubtotal: 0 };
      const otherItemsSubtotal = Number(input.otherItemsSubtotal) || 0;
      const orderSubtotal = round2(subtotalBeforeMembership + otherItemsSubtotal);
      const meetsThreshold = !m.minSubtotal || orderSubtotal >= m.minSubtotal;
      const membershipDiscount = round2(subtotalBeforeMembership * (meetsThreshold ? m.percent : 0));
      const membershipFee = meetsThreshold ? (m.fee || 0) : 0;
      const subtotalAfterMembership = round2(
        subtotalBeforeMembership - membershipDiscount + membershipFee
      );

      let deliveryCost = 0;
      const isMember = !!input.membership && String(input.membership).trim().toLowerCase() !== 'non member';
      if (input.deliveryZone === 'bangkok') {
        const baseRate = p.deliveryBangkokRate || 0;
        deliveryCost = isMember ? round2(baseRate * 0.5) : baseRate;
      } else if (input.deliveryZone === 'domestic') {
        const actualCost = Number(input.domesticActualCost) || 0;
        deliveryCost = isMember ? round2(actualCost * 0.5) : actualCost;
      } else if (input.deliveryZone === 'international') {
        deliveryCost = Number(input.internationalActualCost) || 0;
      }

      const installationCost = input.installation ? (Number(input.installationActualCost) || 0) : 0;

      const total = round2(subtotalAfterMembership + deliveryCost + installationCost);

      return {
        size, pricePerCm2, genericPrice,
        materialCost, difficultyCost, fastTrackCost, frameCost,
        subtotalBeforeMembership,
        membershipDiscount, membershipFee, subtotalAfterMembership,
        membershipThresholdMet: meetsThreshold, membershipMinSubtotal: m.minSubtotal || 0, orderSubtotal: orderSubtotal,
        deliveryCost, installationCost, total
      };
    }

    let FORM_DATA = {};
    let itemCounter = 0;
    let itemResults = {};   // id -> result object
    let itemImages = {};    // id -> {url, name}
    let calcTimers = {};

    function baht(n){ return 'THB ' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function itemTemplateHtml(id){

            <label><input type="radio" name="delivery-${id}" value="bangkok"> <span>Bangkok <span id="bangkokTag-${id}" style="font-size:11px; font-weight:700; color:#c0392b;"></span><span class="th">(ในกรุงเทพฯ)</span></span></label>

            <label><input type="radio" name="delivery-${id}" value="domestic"> <span>Domestic <span id="domesticTag-${id}" style="font-size:11px; font-weight:700; color:#c0392b;"></span><span class="th">(ต่างจังหวัด)</span></span></label>
            <div id="domesticBox-${id}" style="display:none; margin-left:26px;">
              <label style="font-size:12px; color:#6b6153;">Delivery Cost<span class="th">(ค่าส่งตามจริง — ลด 50% อัตโนมัติถ้าเป็นสมาชิก)</span></label>
              <input type="number" id="domesticActualCost-${id}" min="0" step="1" inputmode="numeric">

              <input type="number" id="internationalActualCost-${id}" min="0" step="1" inputmode="numeric">

            <div class="line"><span>Material</span><span id="r-material-${id}"></span></div>
            <div class="line"><span>Difficulty</span><span id="r-difficulty-${id}"></span></div>

            <div id="thresholdNote-${id}" class="th" style="display:none; color:#b5652f; margin:-4px 0 4px;"></div>

    function fillSelect(el, obj){
      el.innerHTML = '';
      Object.keys(obj).forEach(k=>{
        const o = document.createElement('option'); o.value=k; o.textContent=k;
        el.appendChild(o);
      });
    }

    // membership เป็น object {percent, fee, note} ไม่ใช่ตัวเลขเฉยๆ เหมือน material/difficulty
    // แสดง % ส่วนลดต่อท้ายชื่อ และข้อความเสริม (เช่น "& special gift") ถ้ามี
    function fillMembershipSelect(el, obj){
      el.innerHTML = '';
      Object.keys(obj).forEach(k=>{
        const info = obj[k] || {};
        const o = document.createElement('option'); o.value = k;
        let text = k;
        if (info.percent) {
          text += ' — ' + Math.round(info.percent * 1000) / 10 + '%';
          if (info.note) text += ' ' + info.note;
        }
        o.textContent = text;
        el.appendChild(o);
      });
    }

    // อัปเดตป้ายกำกับ "(ลด 50%)" ที่ Bangkok/Domestic และโน้ตใต้ Bangkok ตามสมาชิก+โซนที่เลือกอยู่
    function updateDeliveryUI(id){
      const zoneEl = document.querySelector(`input[name=delivery-${id}]:checked`);
      const zone = zoneEl ? zoneEl.value : 'pickup';
      const membershipVal = document.getElementById('membership-' + id).value;
      const isMember = !!membershipVal && membershipVal.trim().toLowerCase() !== 'non member';
      const tag = isMember ? 'ลด 50%' : '';
      const bTag = document.getElementById('bangkokTag-' + id);
      const dTag = document.getElementById('domesticTag-' + id);
      if (bTag) bTag.textContent = tag;
      if (dTag) dTag.textContent = tag;
      const dBox = document.getElementById('domesticBox-' + id);
      if (dBox) dBox.style.display = (zone === 'domestic') ? 'block' : 'none';
      const iBox = document.getElementById('internationalBox-' + id);
      if (iBox) iBox.style.display = (zone === 'international') ? 'block' : 'none';
    }

    function renumberItems(){
      document.querySelectorAll('#itemsContainer > .card').forEach((card, i)=>{
        const id = card.id.split('-')[1];
        const el = document.getElementById('itemnum-' + id);
        if (el) el.textContent = 'Item #' + (i + 1);
      });
    }

    function addItem(){
      itemCounter++;
      const id = itemCounter;
      const container = document.getElementById('itemsContainer');
      const wrap = document.createElement('div');
      wrap.innerHTML = itemTemplateHtml(id);
      container.appendChild(wrap.firstElementChild);

      const sel = document.getElementById('product-' + id);
      Object.keys(FORM_DATA).forEach(k=>{
        const o = document.createElement('option'); o.value=k; o.textContent=FORM_DATA[k].label;
        sel.appendChild(o);
      });
      onProductChange(id);

      sel.addEventListener('change', ()=>onProductChange(id));
      document.querySelectorAll(`input[name=delivery-${id}]`).forEach(r=>{
        r.addEventListener('change', ()=>{
          updateDeliveryUI(id);
          runCalculation(id);
        });
      });
      document.getElementById('membership-' + id).addEventListener('change', ()=>{
        updateDeliveryUI(id);
        runCalculation(id);
      });
      document.getElementById('installation-' + id).addEventListener('change', function(){
        document.getElementById('installBox-' + id).style.display = this.checked ? 'block' : 'none';
        runCalculation(id);
      });
      ['width','height','material','difficulty','fastTrack','frame','domesticActualCost','internationalActualCost','installationActualCost']
        .forEach(f=>{
          const el = document.getElementById(f + '-' + id);
          el.addEventListener('input', ()=>runCalculation(id));
          el.addEventListener('change', ()=>runCalculation(id));
        });

      renumberItems();
      runCalculation(id);
    }

    function removeItem(id){
      const el = document.getElementById('item-' + id);
      if (el) el.remove();
      delete itemResults[id];
      delete itemImages[id];
      renumberItems();
      updateGrandTotal();
    }

    function onProductChange(id){
      const p = FORM_DATA[document.getElementById('product-' + id).value];
      if (!p) return;
      fillSelect(document.getElementById('material-' + id), p.material);
      fillSelect(document.getElementById('difficulty-' + id), p.difficulty);
      fillMembershipSelect(document.getElementById('membership-' + id), p.membership);
      updateDeliveryUI(id);
      runCalculation(id);
    }

    function uploadPhoto(id, input){
      const file = input.files && input.files[0];
      const status = document.getElementById('photostatus-' + id);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(){
        const dataUrl = reader.result;
        const thumb = document.getElementById('thumb-' + id);
        thumb.src = dataUrl; thumb.style.display = 'block';
        status.textContent = 'กำลังอัปโหลด… (uploading)';
        const base64 = dataUrl.split(',')[1];
        callApi('uploadItemImage', { name: file.name, mimeType: file.type, data: base64 })
          .then(function(res){
            if (res && res.error) throw new Error(res.error);
            itemImages[id] = { url: res.url, id: res.id, name: file.name, dataUrl: dataUrl };
            status.textContent = 'แนบรูปแล้ว ✓ ' + file.name;
          })
          .catch(function(e){
            status.textContent = 'อัปโหลดไม่สำเร็จ: ' + e.message;
          });
      };
      reader.readAsDataURL(file);
    }

    function buildInput(id){
      return {
        itemName: document.getElementById('itemName-' + id).value,
        imageUrl: (itemImages[id] && itemImages[id].url) || '',
        imageId: (itemImages[id] && itemImages[id].id) || '',
        product: document.getElementById('product-' + id).value,
        width: document.getElementById('width-' + id).value,
        height: document.getElementById('height-' + id).value,
        material: document.getElementById('material-' + id).value,
        difficulty: document.getElementById('difficulty-' + id).value,
        fastTrack: document.getElementById('fastTrack-' + id).checked,
        frame: document.getElementById('frame-' + id).checked,
        membership: document.getElementById('membership-' + id).value,
        deliveryZone: document.querySelector(`input[name=delivery-${id}]:checked`).value,
        domesticActualCost: document.getElementById('domesticActualCost-' + id).value,
        internationalActualCost: document.getElementById('internationalActualCost-' + id).value,
        installation: document.getElementById('installation-' + id).checked,
        installationActualCost: document.getElementById('installationActualCost-' + id).value,
        // ผลรวม subtotal ของรายการอื่นๆ ในใบเสนอราคาเดียวกัน (ใช้เช็คยอดขั้นต่ำสมาชิกแบบรวมทั้งใบ)
        otherItemsSubtotal: getOtherItemsSubtotal(id)
      };
    }

    function getOtherItemsSubtotal(excludeId){
      let sum = 0;
      for (const k in itemResults) {
        if (String(k) === String(excludeId)) continue;
        sum += Number((itemResults[k] && itemResults[k].subtotalBeforeMembership) || 0);
      }
      return sum;
    }

    function runCalculation(id){
      clearTimeout(calcTimers[id]);
      calcTimers[id] = setTimeout(()=>doCalc(id, true), 200);
    }

    // notifySiblings=true เมื่อรายการนี้เปลี่ยนค่าเอง (ต้องอัปเดตยอดขั้นต่ำของรายการอื่นตาม)
    // notifySiblings=false เมื่อถูกเรียกให้รีเฟรชเพราะรายการอื่นเปลี่ยน (กันการวนเรียกไม่รู้จบ)
    // คำนวณฝั่ง client ทันที (calculatePriceLocal) ไม่ยิง request ไป Apps Script ทุกครั้งที่พิมพ์แล้ว —
    // ข้อมูล tier/rate ถูกดึงมาครั้งเดียวตอนโหลดหน้า (FORM_DATA จาก getFormOptions) ยังคงยึด Google Sheet
    // เป็นแหล่งข้อมูลจริงอยู่ ส่วน runCalculation() ด้านบนมี debounce 200ms กันไม่ให้คำนวณรัวเกินไป
    function doCalc(id, notifySiblings){
      const errEl = document.getElementById('err-' + id);
      if (!errEl) return; // ถูกลบไปแล้ว
      errEl.style.display='none';
      const input = buildInput(id);
      if (!input.product) return;
      let r;
      try {
        r = calculatePriceLocal(input);
      } catch (e) {
        errEl.textContent = 'เกิดข้อผิดพลาด: ' + e.message;
        errEl.style.display='block';
        return;
      }
      if (!document.getElementById('item-' + id)) return; // ถูกลบไปแล้วระหว่างคำนวณ
      // แสดงเฉพาะบรรทัดที่มีค่า — อันไหนเป็น 0 / ยังไม่กรอก ซ่อนไว้
      let shown = 0;
      function setLine(key, value, text){
        const el = document.getElementById('r-' + key + '-' + id);
        if (!el) return;
        const show = Math.abs(Number(value) || 0) > 0.0001;
        el.textContent = show ? text : '';
        el.closest('.line').style.display = show ? 'flex' : 'none';
        if (show) shown++;
      }
      setLine('size', r.size, Number(r.size||0).toLocaleString('en-US') + ' cm²');
      setLine('generic', r.genericPrice, baht(r.genericPrice));
      setLine('material', r.materialCost, baht(r.materialCost));
      setLine('difficulty', r.difficultyCost, baht(r.difficultyCost));
      setLine('fasttrack', r.fastTrackCost, baht(r.fastTrackCost));
      setLine('frame', r.frameCost, baht(r.frameCost));
      setLine('subtotal', r.subtotalBeforeMembership, baht(r.subtotalBeforeMembership));
      setLine('discount', r.membershipDiscount, '-' + baht(r.membershipDiscount));
      setLine('fee', r.membershipFee, baht(r.membershipFee));
      const thNote = document.getElementById('thresholdNote-' + id);
      if (thNote) {
        const showTh = r.membershipThresholdMet === false && r.membershipMinSubtotal > 0;
        thNote.style.display = showTh ? 'block' : 'none';
        if (showTh) thNote.textContent = 'ยอดรวมทั้งหมดยังไม่ถึงขั้นต่ำ ' + Number(r.membershipMinSubtotal).toLocaleString('en-US') + ' บาท — ยังไม่ได้ส่วนลดสมาชิกระดับนี้';
      }
      setLine('delivery', r.deliveryCost, baht(r.deliveryCost));
      setLine('install', r.installationCost, baht(r.installationCost));
      setLine('total', r.total, baht(r.total));
      document.querySelector('#item-' + id + ' .breakdown').style.display = shown ? 'block' : 'none';
      itemResults[id] = r;
      updateGrandTotal();
      // ยอดของรายการนี้เปลี่ยน อาจทำให้รายการอื่นข้ามขั้นต่ำสมาชิกได้/ไม่ได้ตาม ต้องรีเฟรชรายการอื่นด้วย
      if (notifySiblings) {
        currentItemIds().filter(k => String(k) !== String(id)).forEach(k => doCalc(k, false));
      }
    }

    function updateGrandTotal(){
      const sum = Object.values(itemResults).reduce((a,r)=>a+Number((r&&r.total)||0), 0);
      document.getElementById('grand-total').textContent = baht(sum);
    }

    function currentItemIds(){
      return Array.from(document.querySelectorAll('#itemsContainer > .card')).map(c=>c.id.split('-')[1]);
    }

    function openPreview(){
      const ids = currentItemIds();
      const qno = document.getElementById('quotationNo').value || '—';
      const cid = document.getElementById('commissionId').value;
      const by = document.getElementById('assessedBy').value;
      let sum = 0;
      const rows = ids.map((id, i)=>{
        const inp = buildInput(id);
        const r = itemResults[id] || {};
        sum += Number(r.total||0);
        const p = FORM_DATA[inp.product];
        const specs = [
          p ? p.label : inp.product,
          (inp.width||0) + '×' + (inp.height||0) + ' cm',
          inp.material, inp.difficulty,
          inp.fastTrack ? 'Fast Track' : '', inp.frame ? 'Frame' : '',
          inp.membership,
          inp.deliveryZone === 'pickup' ? 'Pick up' : (inp.deliveryZone === 'bangkok' ? 'Delivery: Bangkok' :
            inp.deliveryZone === 'international' ? 'Delivery: International' : 'Delivery: Domestic'),
          inp.installation ? 'Installation' : ''
        ].filter(Boolean).join(' · ');
        return `<div class="qitem">
          ${itemImages[id] && itemImages[id].dataUrl ? `<img class="qthumb" src="${itemImages[id].dataUrl}" alt="">` : ''}
          <div class="qcol">
            <div class="qitem-head"><span>${i+1}. ${esc(inp.itemName) || 'Untitled item'}</span><span>${baht(r.total)}</span></div>
            <div class="qitem-spec">${esc(specs)}</div>
            ${breakdownHtml(r)}
          </div>
        </div>`;
      }).join('');

      document.getElementById('quoteBody').innerHTML = `
        <h2>Painting Assessment Receipt</h2>
        <div class="meta">
          No. ${esc(qno)}${cid ? ' · Project ' + esc(cid) : ''}<br>
          ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}${by ? ' · Assessed by ' + esc(by) : ''}
        </div>
        ${rows || '<div class="qitem-spec">ยังไม่มีรายการ</div>'}
        <div class="qtotal"><span>Grand Total</span><span>${baht(sum)}</span></div>`;
      document.getElementById('previewOverlay').classList.add('on');
      window.scrollTo(0,0);
    }

    // รายละเอียดค่าใช้จ่ายแยกหัวข้อของแต่ละรายการ (ข้ามบรรทัดที่เป็น 0)
    function breakdownHtml(r){
      if (!r || !r.total) return '';
      const rows = [
        ['Base price (ราคาตามขนาด)', r.genericPrice],
        ['Material (วัสดุ)', r.materialCost],
        ['Difficulty (ความยาก)', r.difficultyCost],
        ['Fast Track (งานเร่ง)', r.fastTrackCost],
        ['Frame (กรอบ)', r.frameCost]
      ].filter(x => Number(x[1]) > 0)
       .map(x => `<div><span>${x[0]}</span><span>${baht(x[1])}</span></div>`);

      const after = [
        ['Membership discount (ส่วนลดสมาชิก)', r.membershipDiscount ? -r.membershipDiscount : 0],
        ['Membership fee (ค่าสมาชิก)', r.membershipFee],
        ['Delivery (ค่าจัดส่ง)', r.deliveryCost],
        ['Installation (ค่าติดตั้ง)', r.installationCost]
      ].filter(x => Number(x[1]) !== 0)
       .map(x => `<div class="${x[2]||''}"><span>${x[0]}</span><span>${Number(x[1]) < 0 ? '-' + baht(Math.abs(x[1])) : baht(x[1])}</span></div>`);

      return '<div class="qbreak">' + rows.join('') + after.join('') + '</div>';
    }

    function closePreview(){ document.getElementById('previewOverlay').classList.remove('on'); }

    function buildPayload(){
      return {
        quotationNo: document.getElementById('quotationNo').value,
        commissionId: document.getElementById('commissionId').value,
        internalNotes: document.getElementById('internalNotes').value,
        assessedBy: document.getElementById('assessedBy').value,
        items: currentItemIds().map(id=>buildInput(id))
      };
    }

    // ปุ่ม "Print PDF" (ในหน้าตัวอย่าง) ตอนนี้ทำหน้าที่เดียว: สร้าง PDF + บันทึกข้อมูลลงชีต + คืนลิงก์ Drive มาให้
    function createAndSavePdf(){
      const msg = document.getElementById('pdfMsg');
      const btn = document.getElementById('printBtn');

      const payload = buildPayload();
      if (payload.items.length === 0){
        msg.textContent = 'กรุณาเพิ่มอย่างน้อย 1 รายการก่อนบันทึก';
        return;
      }

      btn.disabled = true;
      msg.textContent = 'กำลังสร้าง PDF และบันทึกลงชีต…';
      callApi('createQuotationPdf', payload)
        .then(function(res){
          if (res && res.error) throw new Error(res.error);
          btn.disabled = false;
          msg.innerHTML = 'Saved ✓ Grand Total ' + baht(res.grandTotal) + ' (บันทึกเรียบร้อย ' + res.itemCount +
            ' รายการ) · <a href="' + res.url + '" target="_blank" style="color:#fff; text-decoration:underline;">เปิดดู PDF ใน Drive</a>';
          window.open(res.url, '_blank');
          window.print(); // เสร็จแล้วเปิดหน้าต่างสั่งพิมพ์ต่อทันที (พิมพ์เฉพาะส่วนใบเสนอราคา ตาม @media print ด้านบน)
        })
        .catch(function(e){
          btn.disabled = false;
          msg.textContent = 'บันทึกไม่สำเร็จ: ' + e.message;
        });
    }

    // ---- เชื่อมต่อ backend จริงเท่านั้น ----
    let _banner = null;
    function showBanner(title, msg, color){
      if (!_banner) {
        _banner = document.createElement('div');
        document.body.insertBefore(_banner, document.body.firstChild);
      }
      _banner.style.cssText = 'background:' + color + ';color:#fff;padding:14px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.5;';
      _banner.innerHTML = title + '<br><span style="font-weight:400;">' + msg + '</span>';
    }
    function hideBanner(){ if (_banner) { _banner.remove(); _banner = null; } }
    // หน้าจอ "กำลังเชื่อมต่อ" กึ่งกลางจอ (ทับทั้งหน้า) แทนแบนเนอร์ด้านบน
    function showLoading(){
      hideBanner();
      _banner = document.createElement('div');
      _banner.style.cssText = 'position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;' +
        'background:var(--bg,#faf6ee); text-align:center; padding:24px;';
      _banner.innerHTML = '<div style="font-size:15px; color:#8a7f6f; line-height:1.6;">Connecting to the latest data...</div>';
      document.body.appendChild(_banner);
    }
    function showConnectionError(msg){
      showBanner('⚠️ เชื่อมต่อกับ Google Apps Script ไม่ได้', msg +
        ' <button type="button" onclick="startApp()" style="margin-top:8px;background:#fff;color:#b23;border:0;border-radius:999px;padding:6px 14px;font-weight:700;">ลองใหม่</button>', '#b23');
    }

    function startApp(){
      if (API_URL.indexOf('XXXX') !== -1) {
        showConnectionError('ยังไม่ได้ใส่ API_URL จริงในไฟล์นี้');
        return;
      }
      // Apps Script ตอนเรียกครั้งแรกมี cold start ได้ถึง ~20 วิ — แสดงสถานะ "กำลังโหลด" ไปก่อน
      // ไม่ขึ้น error จนกว่าจะล้มเหลวจริง (หรือเกิน 45 วิ)
      let done = false;
      showLoading();
      const timeoutId = setTimeout(function(){
        if (!done) showConnectionError('รอการตอบกลับจากเซิร์ฟเวอร์นานเกินไป (45 วินาที)');
      }, 45000);

      callApi('getFormOptions', {})
        .then(function(data){
          done = true; clearTimeout(timeoutId); hideBanner();
          if (data && data.error) throw new Error(data.error);
          if (!data || !Object.keys(data).length) throw new Error('เซิร์ฟเวอร์ตอบกลับว่าง — ตรวจชีต PRICE_SETTING ว่ามีอยู่จริงและ SPREADSHEET_ID ใน Code.gs ถูกต้อง');
          FORM_DATA = data;
          if (!document.querySelector('#itemsContainer > .card')) addItem(); // เริ่มต้น 1 รายการ
        })
        .catch(function(e){
          done = true; clearTimeout(timeoutId);
          showConnectionError(e.message);
        });
    }

    // ===== ด่านรหัสผ่าน (ไม่จำการปลดล็อกไว้เลย — ต้องใส่รหัสผ่านใหม่ทุกครั้งที่เปิด/รีเฟรชหน้านี้
    // แม้จะผ่านเกต Google Sign-In มาแล้วก็ตาม — สองด่านนี้เป็นอิสระต่อกัน) =====
    const PASSWORDS = ['M4599', 'Staff002'];

    function checkPassword(){
      const val = document.getElementById('pwInput').value;
      const err = document.getElementById('pwError');
      if (PASSWORDS.indexOf(val) !== -1) {
        err.textContent = '';
        hideGateAndStart();
      } else {
        err.textContent = 'รหัสผ่านไม่ถูกต้อง';
      }
    }
    document.addEventListener('DOMContentLoaded', function(){
      const pwInput = document.getElementById('pwInput');
      if (pwInput) pwInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') checkPassword(); });
    });

    function hideGateAndStart(){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('appRoot').style.display = '';
      startApp();
    }

    // ไม่มีการเช็ค localStorage ตอนโหลดหน้าอีกต่อไป — อยู่ที่หน้ารหัสผ่านเสมอ (ค่าเริ่มต้นของ #gate)
  </script>
</body>
</html>
